[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "stock-profit-os"
version = "0.1.0"
description = "Motor determinista que convierte exportaciones de gestión de farmacia en acciones semanales valoradas en euros."
requires-python = ">=3.11"
dependencies = [
    "pandas>=2.1",
    "pyyaml>=6.0",
    "jinja2>=3.1",
    "openpyxl>=3.1",  # necesario para leer exportaciones .xlsx
]

[project.optional-dependencies]
# api: servidor local para la web (FastAPI + uvicorn; python-multipart para subir ficheros).
api = ["fastapi>=0.115", "uvicorn>=0.30", "python-multipart>=0.0.9"]
# jsonschema: valida el contrato report.json; httpx: cliente de tests de la API.
dev = ["pytest>=8", "jsonschema>=4", "httpx>=0.27"]

[project.scripts]
stock-profit-os = "engine.cli:main"

[tool.setuptools.packages.find]
include = ["engine*"]

[tool.setuptools.package-data]
engine = ["templates/*.j2"]

[tool.pytest.ini_options]
testpaths = ["tests"]
